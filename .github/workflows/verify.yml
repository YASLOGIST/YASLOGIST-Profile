name: Verify profile assets

# This repository has no application runtime; the artefacts that can actually
# break are the committed artwork, the asset paths in README.md and the
# generator constants that describe them. Every push and pull request re-checks
# those, so the "Verified by automation" table in the README stays true.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Assets, mark geometry and unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Pillow is only needed for the pixel rows of the verifier (palette
      # identity, blank frames, loop seam, flicker) and NumPy only for the
      # single-frame reproduction check. The mark parser, the GIF block walker
      # and the rest of the unit tests are standard library only.
      #
      # The renderer is deliberately *not* pinned: the artwork is not
      # bit-reproducible across machines, so nothing here compares pixels for
      # equality. What must match exactly (build stamp, GIF structure, README
      # paths) is standard library only.
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=10,<14" "numpy>=1.24,<3"

      - name: Byte-compile the generators and tools
        run: |
          python -m py_compile \
            assets/readme/build_hero.py \
            assets/readme/build_poster.py \
            assets/readme/scene.py \
            assets/readme/mark.py \
            tools/verify_assets.py

      - name: Verify committed assets against README.md
        run: |
          set +e
          python tools/verify_assets.py --strict > verify.log 2>&1
          rc=$?
          cat verify.log
          if [ "$rc" -ne 0 ]; then
            # Re-emit the failing lines as annotations: a red X is not much use
            # without the line that failed, and annotations are readable from
            # the API as well as the web UI.
            grep -E 'FAIL|Traceback|[Ee]rror' verify.log | head -12 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$rc"

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Whitespace hygiene
        run: |
          if git grep -nI '[[:space:]]$' -- '*.md' '*.py' '*.yml'; then
            echo "::error::trailing whitespace found in tracked files"
            exit 1
          fi
